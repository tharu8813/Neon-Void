[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neon-void"
version = "0.2.0.dev0"
description = "Zero-runtime-dependency tkinter bullet-hell roguelike"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
neon-void = "neonvoid.cli:main"

[tool.setuptools.packages.find]
include = ["neonvoid*"]

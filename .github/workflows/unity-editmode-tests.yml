# Unity EditMode tests.
#
# Built on the first-party Unity CLI (`unity ci init` generated the skeleton),
# not on a third-party Unity action: CLAUDE.md asks whether the official tooling
# can do the job before a new dependency is added, and here it can. The only
# actions used are GitHub's own checkout / cache / upload-artifact.
#
# Scope is tests only. `unity ci init` also emits a Build step, which is removed
# here: this project has no build target configured and no Linux build support
# installed, so a build step would fail for reasons that have nothing to do with
# the code under review. Add it back when P2 needs a player.
#
# ---------------------------------------------------------------------------
# ONE-TIME SETUP: the UNITY_LICENSE_FILE_BASE64 secret
# ---------------------------------------------------------------------------
# Until that secret exists, the test job is skipped and the run is marked with a
# warning. This is deliberate: a green check that verified nothing is worse than
# a visibly missing one.
#
# This project runs on Unity Personal, which CANNOT be activated in CI with a
# serial or a service account - Unity's licensing backend rejects both for
# activation. The supported unattended path is an offline license file:
#
#   1. On a machine with the Editor installed and signed in:
#        unity license activate --generate-request unity.alf
#   2. Upload unity.alf at https://license.unity3d.com/manual and download the
#      resulting .ulf file.
#   3. Base64-encode it:
#        base64 -w0 Unity_v6000.x.ulf        (Linux)
#        [Convert]::ToBase64String([IO.File]::ReadAllBytes('Unity_v6000.x.ulf'))  (PowerShell)
#   4. Add the string as repository secret UNITY_LICENSE_FILE_BASE64
#      (Settings -> Secrets and variables -> Actions).
#
# A .ulf is tied to a machine and to an account. Treat it as a credential: it
# belongs in a secret, never in the repository.

name: Unity EditMode tests

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: unity-editmode-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The secrets context is not available in a job-level `if`, so the presence
  # check runs in its own job and is passed on as an output.
  license-check:
    name: Check for a Unity license secret
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          LICENSE_FILE_BASE64: ${{ secrets.UNITY_LICENSE_FILE_BASE64 }}
        run: |
          if [ -n "$LICENSE_FILE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unity EditMode tests skipped::UNITY_LICENSE_FILE_BASE64 is not set, so the Editor cannot be activated and no test ran. See the setup notes at the top of .github/workflows/unity-editmode-tests.yml."
          fi

  editmode-tests:
    name: EditMode tests
    needs: license-check
    if: needs.license-check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: unity

    env:
      # Failures become GitHub annotations instead of living only in the log.
      UNITY_FORMAT: github
      UNITY_NON_INTERACTIVE: '1'
      # The editor version is read from unity/ProjectSettings/ProjectVersion.txt
      # by the CLI; it is repeated here only for the download cache key.
      UNITY_EDITOR_VERSION: 6000.3.24f1

    steps:
      - uses: actions/checkout@v4

      - name: Mask the license in logs
        working-directory: .
        env:
          LICENSE_FILE_BASE64: ${{ secrets.UNITY_LICENSE_FILE_BASE64 }}
        run: echo "::add-mask::$LICENSE_FILE_BASE64"

      - name: Install the Unity CLI
        working-directory: .
        run: |
          curl -fsSL https://unity.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Editor installer archives, so a re-run does not re-download several GB.
      - name: Restore the Unity download cache
        uses: actions/cache@v4
        with:
          path: ~/.config/unityhub/downloads
          key: unity-downloads-${{ env.UNITY_EDITOR_VERSION }}

      # The Editor is a desktop application even in batch mode and the hosted
      # image does not carry its shared libraries; without these it exits before
      # printing anything useful. Package names are the Ubuntu 24.04 spellings
      # that match runs-on: ubuntu-latest.
      - name: Install the Editor's runtime libraries
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libgtk-3-0t64 libnss3 \
            libasound2t64 libgbm1 libdrm2 libxtst6 \
            libxrandr2 libxcursor1 libxcomposite1 libxdamage1 \
            libxfixes3 libxi6 libxrender1 libxext6 \
            libsm6 libice6 libxkbcommon0 libpango-1.0-0 \
            libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libcups2t64 libdbus-1-3 libnotify4 \
            libsecret-1-0

      - name: Install the Unity Editor
        run: unity install "$UNITY_EDITOR_VERSION" --yes --accept-eula

      - name: Activate the Unity license
        env:
          LICENSE_FILE_BASE64: ${{ secrets.UNITY_LICENSE_FILE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$LICENSE_FILE_BASE64" | base64 -d > "$RUNNER_TEMP/unity.ulf"
          unity license activate --file "$RUNNER_TEMP/unity.ulf"
          rm -f "$RUNNER_TEMP/unity.ulf"

      # `unity cache key` hashes only what actually invalidates Library/: the
      # editor version, the resolved package set and the build target. Editing a
      # script keeps a cache that is still valid for it.
      - name: Compute the Library cache key
        id: cache-key
        run: echo "key=$(unity cache key --format human)" >> "$GITHUB_OUTPUT"

      - name: Restore the project Library folder
        uses: actions/cache@v4
        with:
          path: unity/Library
          key: unity-library-${{ steps.cache-key.outputs.key }}

      # Fails in seconds when the machine cannot finish a run at all, rather
      # than tens of minutes in.
      - name: Preflight
        run: unity doctor --ci

      # EditMode only: Tests/PlayMode does not exist yet. Add --mode PlayMode as
      # a second step when it does, so a PlayMode failure is distinguishable.
      - name: Run EditMode tests
        run: unity test --mode EditMode --report-format junit --output test-results.xml --timeout 900

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: unity/test-results.xml
          if-no-files-found: warn

      # The license is machine-bound and seats are limited, so it is returned
      # even when the tests failed or the job was cancelled.
      - name: Return the Unity license
        if: always()
        run: unity license return --yes || true

name: Godot 4 port checks

on:
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-ci.yml'
      - '.gitignore'
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-ci.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_TAG: '4.7.2-stable'

jobs:
  headless:
    name: Godot headless import and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot editor on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/$GODOT_TAG/Godot_v${GODOT_TAG}_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_TAG}_linux.x86_64"
          echo "NEON_GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_TAG}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install pinned Godot editor on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $uri = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_TAG/Godot_v$env:GODOT_TAG`_win64.exe.zip"
          Invoke-WebRequest -Uri $uri -OutFile (Join-Path $env:RUNNER_TEMP 'godot.zip')
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'godot.zip') -DestinationPath $target
          $editor = Get-ChildItem -Path $target -Filter '*win64.exe' -File | Select-Object -First 1
          if (-not $editor) { throw 'Pinned Godot Windows executable not found' }
          "NEON_GODOT=$($editor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Editor import, static parse, script smoke, scene boot
        shell: pwsh
        run: |
          & $env:NEON_GODOT --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:NEON_GODOT --headless --path godot --editor --import --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:NEON_GODOT --headless --path godot --script res://tests/port_smoke.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:NEON_GODOT --headless --path godot --script res://tests/combat_smoke.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:NEON_GODOT --headless --path godot --script res://tests/sector_smoke.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:NEON_GODOT --headless --path godot --quit-after 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-export:
    # Full templates exceed 1.2GB. This expensive binary export check is
    # opt-in to avoid downloading them on every ordinary code-only PR.
    if: github.event_name == 'workflow_dispatch'
    name: Windows x64 export smoke (manual, full templates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download editor and Windows export template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_TAG/Godot_v${GODOT_TAG}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_TAG/Godot_v$GODOT_TAG_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/extracted" "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          unzip -q "$RUNNER_TEMP/templates.tpz" 'templates/windows_release_x86_64.exe' -d "$RUNNER_TEMP/extracted"
          cp "$RUNNER_TEMP/extracted/templates/windows_release_x86_64.exe" "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/"
          echo "NEON_GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_TAG}_linux.x86_64" >> "$GITHUB_ENV"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_TAG}_linux.x86_64"
      - name: Import and produce Windows executable
        shell: bash
        run: |
          set -euo pipefail
          "$NEON_GODOT" --headless --path godot --editor --import --quit
          mkdir -p godot/build
          "$NEON_GODOT" --headless --path godot --export-release "Windows Desktop" build/NeonVoid3D.exe
          test -s godot/build/NeonVoid3D.exe
      - uses: actions/upload-artifact@v4
        with:
          name: NeonVoid3D-windows-export-smoke
          path: godot/build/NeonVoid3D.exe
          if-no-files-found: error
          retention-days: 7

name: Godot 4 port checks

on:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/godot-ci.yml'
      - '.gitignore'
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/godot-ci.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: '4.7.2'
  GODOT_TAG: '4.7.2-stable'

jobs:
  headless:
    name: Godot headless import and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot editor on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/$GODOT_TAG/Godot_v${GODOT_TAG}_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_TAG}_linux.x86_64"
          echo "NEON_GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_TAG}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install pinned Godot editor on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $uri = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_TAG/Godot_v$env:GODOT_TAG`_win64.exe.zip"
          Invoke-WebRequest -Uri $uri -OutFile (Join-Path $env:RUNNER_TEMP 'godot.zip')
          Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'godot.zip') -DestinationPath $target
          $editor = Get-ChildItem -Path $target -Filter '*win64.exe' -File | Select-Object -First 1
          if (-not $editor) { throw 'Pinned Godot Windows executable not found' }
          "NEON_GODOT=$($editor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Linux editor import, script smoke and scene boot
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          "$NEON_GODOT" --version
          "$NEON_GODOT" --headless --path . --editor --import --quit
          "$NEON_GODOT" --headless --path . --script res://tests/port_smoke.gd
          "$NEON_GODOT" --headless --path . --quit-after 3
      - name: Windows editor import, script smoke and scene boot (real exit codes)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # GUI-subsystem Godot processes do not reliably set LASTEXITCODE
          # when invoked with '&' from PowerShell; await the process.
          function Invoke-CheckedGodot([string]$arguments) {
            $p = Start-Process -FilePath $env:NEON_GODOT -ArgumentList $arguments -PassThru -Wait -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "Godot failed (exit $($p.ExitCode)): $arguments" }
          }
          Invoke-CheckedGodot '--version'
          Invoke-CheckedGodot '--headless --path . --editor --import --quit'
          Invoke-CheckedGodot '--headless --path . --script res://tests/port_smoke.gd'
          Invoke-CheckedGodot '--headless --path . --quit-after 3'

      - name: Rework isolated regression scripts (Linux, if present)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # PRs intentionally own separate rework namespaces. Execute every present smoke,
          # and require its actual nonzero failure code to fail this job.
          scripts=(
            tests/rework/combat/combat_foundation_smoke.gd
            tests/rework/skills/skill_foundation_smoke.gd
            tests/rework/plugins/plugin_reward_smoke.gd
            tests/rework/plugins/plugin_live_effects_smoke.gd
            tests/rework/world/world_foundation_smoke.gd
            tests/rework/camera/look_ahead_smoke.gd
            tests/rework/world/hub_motherboard_smoke.gd
            tests/rework/world/cpu_vertical_slice_smoke.gd
            tests/rework/world/hardware_rules_smoke.gd
            tests/rework/progression/progression_smoke.gd
            tests/rework/persistence/persistence_smoke.gd
            tests/rework/integration/mission_commit_bridge_smoke.gd
            tests/rework/integration/rework_pilot_smoke.gd
            tests/rework/integration/rare_bonus_pilot_smoke.gd
            tests/rework/integration/pilot_recovery_view_smoke.gd
            tests/rework/integration/pilot_tactical_hud_smoke.gd
            tests/rework/integration/pilot_reward_card_ux_smoke.gd
          )
          count=0
          failures=0
          for script in "${scripts[@]}"; do
            if [ -f "$script" ]; then
              echo "::group::Rework smoke: $script"
              if ! timeout --signal=TERM --kill-after=5s 25s "$NEON_GODOT" --headless --path . --script "res://$script"; then
                echo "::error::Failed rework smoke: $script"
                failures=$((failures + 1))
              fi
              echo "::endgroup::"
              count=$((count + 1))
            fi
          done
          echo "Executed $count rework smoke scripts on Linux; failures=$failures" >> "$GITHUB_STEP_SUMMARY"
          if [ "$failures" -ne 0 ]; then exit 1; fi
      - name: Rework isolated regression scripts (Windows, if present)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Godot is a Windows GUI-subsystem process: await and check ExitCode explicitly.
          $scripts = @(
            'tests/rework/combat/combat_foundation_smoke.gd',
            'tests/rework/skills/skill_foundation_smoke.gd',
            'tests/rework/plugins/plugin_reward_smoke.gd',
            'tests/rework/plugins/plugin_live_effects_smoke.gd',
            'tests/rework/world/world_foundation_smoke.gd',
            'tests/rework/camera/look_ahead_smoke.gd',
            'tests/rework/world/hub_motherboard_smoke.gd',
            'tests/rework/world/cpu_vertical_slice_smoke.gd',
            'tests/rework/world/hardware_rules_smoke.gd',
            'tests/rework/progression/progression_smoke.gd',
            'tests/rework/persistence/persistence_smoke.gd',
            'tests/rework/integration/mission_commit_bridge_smoke.gd',
            'tests/rework/integration/rework_pilot_smoke.gd',
            'tests/rework/integration/rare_bonus_pilot_smoke.gd',
            'tests/rework/integration/pilot_recovery_view_smoke.gd',
            'tests/rework/integration/pilot_tactical_hud_smoke.gd',
            'tests/rework/integration/pilot_reward_card_ux_smoke.gd'
          )
          $count = 0
          $failures = 0
          foreach ($script in $scripts) {
            if (Test-Path -LiteralPath $script) {
              Write-Host "Rework smoke: $script"
              $args = '--headless --path . --script res://' + $script
              $p = Start-Process -FilePath $env:NEON_GODOT -ArgumentList $args -NoNewWindow -PassThru
              $finished = $p.WaitForExit(25000)
              if (-not $finished) {
                Write-Host "::error::Rework smoke timed out (25 seconds): $script"
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                $p.WaitForExit()
                $failures++
              } elseif ($p.ExitCode -ne 0) {
                Write-Host "::error::Rework smoke failed (exit $($p.ExitCode)): $script"
                $failures++
              }
              $count++
            }
          }
          "Executed $count rework smoke scripts on Windows; failures=$failures" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if ($failures -gt 0) { throw "$failures rework smoke tests failed" }

  windows-export:
    # Automated Windows export is required for Godot PRs.
    # Passing headless checks does not prove on-screen GPU rendering or DPI.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: Windows x64 export and executable headless boot
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot editor and Windows x64 export template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $editorDir = Join-Path $env:RUNNER_TEMP 'godot-editor'
          New-Item -ItemType Directory -Path $editorDir -Force | Out-Null
          $uri = 'https://github.com/godotengine/godot-builds/releases/download/' + $env:GODOT_TAG + '/Godot_v' + $env:GODOT_TAG + '_win64.exe.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'godot-editor.zip'
          Invoke-WebRequest -Uri $uri -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $editorDir
          $editor = Get-ChildItem -Path $editorDir -Filter '*win64.exe' -File | Select-Object -First 1
          if (-not $editor) { throw 'Pinned Windows editor not found' }
          "NEON_GODOT=$($editor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $uri = 'https://github.com/godotengine/godot-builds/releases/download/' + $env:GODOT_TAG + '/Godot_v' + $env:GODOT_TAG + '_export_templates.tpz'
          $templateFile = Join-Path $env:RUNNER_TEMP 'godot-templates.tpz'
          Invoke-WebRequest -Uri $uri -OutFile $templateFile
          # TPZ is a ZIP. Extract only the x64 release binary, not all platforms.
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $destination = Join-Path $env:APPDATA ('Godot/export_templates/' + $env:GODOT_VERSION + '.stable')
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $archive = [System.IO.Compression.ZipFile]::OpenRead($templateFile)
          try {
            $entry = $archive.GetEntry('templates/windows_release_x86_64.exe')
            if (-not $entry) { throw 'Windows x64 release template missing' }
            $binary = Join-Path $destination 'windows_release_x86_64.exe'
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $binary, $true)
          } finally {
            $archive.Dispose()
          }
          if (-not (Test-Path $binary)) { throw 'Export template not extracted' }
      - name: Import, export, headless-boot exported Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Godot's standard Windows executable is GUI-subsystem, so PowerShell
          # does NOT reliably await it via '&' or populate LASTEXITCODE.
          # Start-Process -Wait yields a real process exit code.
          function Invoke-CheckedProcess([string]$binary, [string]$arguments) {
            $p = Start-Process -FilePath $binary -ArgumentList $arguments -NoNewWindow -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "Process failed with exit code $($p.ExitCode): $binary $arguments" }
          }
          Invoke-CheckedProcess $env:NEON_GODOT '--version'
          Invoke-CheckedProcess $env:NEON_GODOT '--headless --path . --editor --import --quit'
          New-Item -ItemType Directory -Path 'build' -Force | Out-Null
          Invoke-CheckedProcess $env:NEON_GODOT '--headless --path . --export-release "Windows Desktop" build/NeonVoid3D.exe'
          $exe = (Resolve-Path 'build/NeonVoid3D.exe').Path
          if ((Get-Item $exe).Length -le 0) { throw 'Empty Windows export' }
          Invoke-CheckedProcess $exe '--headless --quit-after 3'
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash
          "Windows x64 export and headless boot passed. SHA256: $hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        with:
          name: NeonVoid3D-windows-export-smoke
          path: build/NeonVoid3D.exe
          if-no-files-found: error
          retention-days: 7

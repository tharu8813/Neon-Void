name: Windows standalone build

on:
  pull_request:
    paths:
      - 'neonvoid/**'
      - 'neon_void.py'
      - 'pyproject.toml'
      - '.github/workflows/windows-build.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    name: Build and smoke-test Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tool
        run: python -m pip install "pyinstaller>=6.16,<7"
      - name: Compile and unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m compileall -q neon_void.py neonvoid tests
          python -m unittest discover -s tests -v
      - name: Create standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NeonVoid neon_void.py
      - name: Verify bundled executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path ".\dist\NeonVoid.exe").Path
          $version = Start-Process -FilePath $exe -ArgumentList @("--version") -Wait -PassThru
          if ($version.ExitCode -ne 0) { throw "Bundled --version failed: $($version.ExitCode)" }
          $smoke = Start-Process -FilePath $exe -ArgumentList @("--selftest", "360", "--no-sound", "--god", "--seed", "42") -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Bundled selftest failed: $($smoke.ExitCode)" }
      - name: Archive binary
        shell: pwsh
        run: Compress-Archive -Path ".\dist\NeonVoid.exe" -DestinationPath ".\dist\NeonVoid-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: NeonVoid-windows-x64
          path: dist/NeonVoid-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

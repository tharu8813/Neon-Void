name: Python validation

env:
  PYTHONIOENCODING: utf-8

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source
        run: python -m compileall -q neon_void.py neonvoid tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check both entrypoints
        run: |
          python neon_void.py --help
          python -m neonvoid --help
      - name: Windows keybinding GUI smoke test
        if: runner.os == 'Windows'
        run: python -m tests.gui_bindings_smoke
      - name: Windows checkpoint recovery GUI smoke test
        if: runner.os == 'Windows'
        run: python -m tests.gui_checkpoint_smoke
      - name: Windows antivirus extraction GUI smoke test
        if: runner.os == 'Windows'
        run: python -m tests.gui_extraction_smoke
      - name: Windows four-sector GUI smoke test
        if: runner.os == 'Windows'
        run: python -m tests.gui_sectors_smoke
      - name: Windows in-world hub GUI smoke test
        if: runner.os == 'Windows'
        run: python -m tests.gui_world_smoke
      - name: Windows combat / HUD GUI smoke test
        if: runner.os == 'Windows'
        run: python -m tests.gui_combat_smoke
      - name: Windows settings GUI smoke test
        if: runner.os == 'Windows'
        run: python -m tests.gui_settings_smoke
      - name: Windows profile GUI smoke test
        if: runner.os == 'Windows'
        run: python -m tests.gui_profile_smoke
      - name: Windows gameplay smoke test
        if: runner.os == 'Windows'
        run: python neon_void.py --selftest 3600 --no-sound --seed 42 --god
      - name: Install Linux framebuffer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Linux keybinding GUI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m tests.gui_bindings_smoke
      - name: Linux checkpoint recovery GUI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m tests.gui_checkpoint_smoke
      - name: Linux antivirus extraction GUI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m tests.gui_extraction_smoke
      - name: Linux four-sector GUI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m tests.gui_sectors_smoke
      - name: Linux in-world hub GUI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m tests.gui_world_smoke
      - name: Linux combat / HUD GUI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m tests.gui_combat_smoke
      - name: Linux settings GUI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m tests.gui_settings_smoke
      - name: Linux profile GUI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m tests.gui_profile_smoke
      - name: Linux gameplay smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m neonvoid --selftest 3600 --no-sound --seed 42 --god

# One-time migration cleanup. Preserve each exact original tip as a tag
# before deleting its old non-default branch. Only this push can trigger it.
name: Archive and retire legacy branches (one time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-pre-godot-20261117.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'tharu8813/Neon-Void' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Preserve original branch tips and delete obsolete refs
        uses: actions/github-script@v7
        with:
          script: |
            const expected = {
                      "feature/opt-in-opengl-gpu-preview-20261117": "d17b3cb4682d231681391fb6e109fcfbed6cd490",
                      "feature/p1-player-profile-20261116": "ca785816eb25b8ff53394296dbea1e75916d0527",
                      "feature/p1-settings-profile-20261116": "a9ca4ac27cfff851e9a36cbe50dc1cee939c01ff",
                      "refactor/modular-foundation-20261116": "4e06bc08f5e5f8d5863540d9f5420770381581cc",
                      "refactor/p1-stage-wave-director-20261116": "f9b3549f2e6d7ff0603381900da669fc60219b47",
                      "test/gameplay-balance-measurement-20261116": "842c48483de1980ffe81aab3d0455ecab586755c"
            };
            const { owner, repo } = context.repo;
            for (const [branch, sha] of Object.entries(expected)) {
              if (branch === 'main' || branch.startsWith('archive/')) {
                throw new Error('Ref cleanup safety guard blocked ' + branch);
              }
              const { data: found } = await github.rest.git.getRef({
                owner, repo, ref: 'heads/' + branch
              });
              if (found.object.sha !== sha) {
                throw new Error('Branch changed since approval: ' + branch);
              }
              const tag = 'archive/pre-godot-20261117/' +
                branch.replaceAll('/', '--');
              try {
                const { data: already } = await github.rest.git.getRef({
                  owner, repo, ref: 'tags/' + tag
                });
                if (already.object.sha !== sha) {
                  throw new Error('Existing archive tag points to different commit: ' + tag);
                }
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({
                  owner, repo, ref: 'refs/tags/' + tag, sha
                });
              }
              core.notice('Archived ' + branch + ' -> ' + tag);
              await github.rest.git.deleteRef({
                owner, repo, ref: 'heads/' + branch
              });
              core.notice('Deleted old branch ' + branch);
            }

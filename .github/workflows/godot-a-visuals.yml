name: Godot P9 visual smoke

on:
  pull_request:
    paths:
      - 'visuals/**'
      - 'tests/p9_visual_smoke.gd'
      - '.github/workflows/godot-a-visuals.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_TAG: '4.7.2-stable'

jobs:
  visual-smoke:
    name: P9 MultiMesh headless structure (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/$GODOT_TAG/Godot_v${GODOT_TAG}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_TAG}_linux.x86_64"
          echo "NEON_GODOT=$RUNNER_TEMP/godot/Godot_v${GODOT_TAG}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import and check visual instancing contract
        shell: bash
        run: |
          set -euo pipefail
          "$NEON_GODOT" --headless --path . --editor --import --quit
          "$NEON_GODOT" --headless --path . --script res://tests/p9_visual_smoke.gd
